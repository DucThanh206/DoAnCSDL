{% extends 'base.html' %}
{% block title %}Đăng tin{% endblock %}
{% block content %}
<div class="card" style="max-width:640px">
  <h1>Đăng tin tuyển dụng</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="title">Tiêu đề</label>
    <input id="title" name="title" maxlength="200" value="{{ form.title or '' }}" required>
    <label for="description">Mô tả</label>
    <textarea id="description" name="description" required>{{ form.description or '' }}</textarea>
    <div class="grid">
      <div><label for="budget_min">Ngân sách tối thiểu ($)</label>
        <input id="budget_min" name="budget_min" type="number" step="0.01" min="0.01" value="{{ form.budget_min or '' }}" required></div>
      <div><label for="budget_max">Ngân sách tối đa ($)</label>
        <input id="budget_max" name="budget_max" type="number" step="0.01" min="0.01" value="{{ form.budget_max or '' }}" required></div>
    </div>
    <div class="mt"><button>Đăng tin</button> <a href="{{ url_for('my_jobs') }}">Hủy</a></div>
  </form>
</div>
{% endblock %}
