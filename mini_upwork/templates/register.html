{% extends 'base.html' %}
{% block title %}Đăng ký{% endblock %}
{% block content %}
<div class="auth card">
  <h1>Đăng ký</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="role">Vai trò</label>
    <select id="role" name="role">
      <option value="CLIENT" {% if form.role == 'CLIENT' %}selected{% endif %}>Khách hàng (CLIENT)</option>
      <option value="FREELANCER" {% if form.role == 'FREELANCER' %}selected{% endif %}>Freelancer</option>
    </select>
    <label for="full_name">Họ tên</label>
    <input id="full_name" name="full_name" value="{{ form.full_name or '' }}" required>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" value="{{ form.email or '' }}" required>
    <label for="password">Mật khẩu (ít nhất 8 ký tự)</label>
    <input id="password" name="password" type="password" minlength="8" required>

    <div id="client-fields">
      <label for="company_name">Công ty (không bắt buộc)</label>
      <input id="company_name" name="company_name" value="{{ form.company_name or '' }}">
      <label for="industry">Lĩnh vực (không bắt buộc)</label>
      <input id="industry" name="industry" value="{{ form.industry or '' }}">
    </div>
    <div id="freelancer-fields">
      <label for="headline">Tiêu đề hồ sơ</label>
      <input id="headline" name="headline" value="{{ form.headline or '' }}">
      <label for="hourly_rate">Giá theo giờ ($)</label>
      <input id="hourly_rate" name="hourly_rate" type="number" step="0.01" min="0.01" value="{{ form.hourly_rate or '' }}">
      <label for="bio">Giới thiệu (không bắt buộc)</label>
      <textarea id="bio" name="bio">{{ form.bio or '' }}</textarea>
    </div>
    <div class="mt"><button>Tạo tài khoản</button></div>
  </form>
</div>
<script>
  (function () {
    var role = document.getElementById('role');
    function sync() {
      var f = role.value === 'FREELANCER';
      document.getElementById('client-fields').hidden = f;
      document.getElementById('freelancer-fields').hidden = !f;
      document.getElementById('headline').required = f;
      document.getElementById('hourly_rate').required = f;
    }
    role.addEventListener('change', sync);
    sync();
  })();
</script>
{% endblock %}
